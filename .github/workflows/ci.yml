# Continuous integration. `checks` runs everything that needs no infrastructure; `integration` starts the compose
# infrastructure and runs the tests that need it; `e2e` starts the whole stack, apps included, and drives a browser
# through it; `secrets` scans the commits. The jobs run in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm test
      # Parses the compose file and .env with every profile enabled; needs no daemon.
      - name: Validate the compose file
        run: docker compose --profile '*' config --quiet
      # `zed validate` offline, through the zed image: the schema parses and its type annotations hold.
      - name: Validate the SpiceDB schema
        run: pnpm authz:validate

  integration:
    name: Integration tests against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The infrastructure without the containerized apps (the tests run on the runner), the way Tilt starts it.
      - name: Start the infrastructure
        run: docker compose up -d --wait
      # Bootstrap is an explicit step outside the apps profile (docker/README.md): it blocks until Zitadel is
      # configured and the handoff files are written, and fails the job on a non-zero exit.
      - name: Configure Zitadel and write the handoff files
        run: docker compose run --rm --build bootstrap
      # What later tickets rely on: the handoff files exist, and the runner resolves the public hostname.
      - name: Check the handoff files and Zitadel's discovery document
        run: |
          ls -l .local/config
          test -s .local/config/dashboard-web.env
          test -s .local/config/apis.env
          test -s .local/config/seed.json
          curl --fail --silent --show-error --output /dev/null http://auth.localtest.me:8080/.well-known/openid-configuration
      - run: pnpm test:integration
      - name: Show the stack on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile '*' down -v

  e2e:
    name: End-to-end tests against the full compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The stack the way a reviewer runs it (root README): the app and bootstrap images built on the runner, every
      # service healthy and bootstrap completed before this returns.
      - name: Start the stack with the apps
        run: docker compose --profile apps up -d --wait --build
      # The one browser the suites drive (apps/*-web/playwright.config.ts), with its system libraries.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The HTML report and, per failed test, the trace (`pnpm exec playwright show-trace <trace.zip>`).
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            apps/dashboard-web/playwright-report
            apps/dashboard-web/test-results
            apps/tenancy-web/playwright-report
            apps/tenancy-web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Show the stack on failure
        if: failure()
        run: |
          docker compose --profile apps ps -a
          docker compose --profile apps logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile '*' down -v

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    # On pull requests the action lists the PR's commits and comments on leaks through the pull request API.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks scans the commits of the push or pull request, so it needs the history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
