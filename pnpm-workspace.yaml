packages:
  - apps/*
  - packages/*

# pnpm 10 refuses dependency lifecycle scripts unless listed. These three ship their native binaries as optional
# dependencies and their postinstall is only a fallback download, so they are ignored on purpose.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - unrs-resolver

# eslint-config-next 16 pulls plugins whose peer ranges stop at ESLint 9 (an end-of-life line); they run on
# ESLint 10, so the warning is silenced here. Drop these entries when the plugins declare ESLint 10.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
    'eslint-plugin-import>eslint': '10'
