# markdownlint configuration. Run with `pnpm lint:md`.
config:
  default: true
  # Paragraphs and bullets are one line each (no hard wrapping); editors soft-wrap.
  MD013: false
  # Two consecutive blockquotes separated by a blank line are used on purpose at the top of the docs.
  MD028: false
globs:
  - '**/*.md'
ignores:
  - node_modules
  - '**/node_modules'
  # Playwright writes an error-context.md per failed test and the HTML report's data under these.
  - '**/test-results'
  - '**/playwright-report'
