# Third-party infrastructure of the auth stack. Values come from the committed .env (insecure development
# defaults; see its header). Zitadel's part is trimmed from Zitadel's v4 reference compose
# (deploy/compose/docker-compose.yml in the Zitadel repository): one network, one hostname, TLS terminated at
# Traefik with a certificate from a development CA that the `tls` one-shot generates (ticket 17b). What each
# service is for, and the conventions around profiles and volumes, are in docker/README.md.
name: auth-stack

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      # Published for processes run on the host by Tilt (ticket 5).
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - auth-stack

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    restart: unless-stopped
    # Root, as in the reference compose, so the PAT files it writes to the shared volume are readable by the
    # login container and bootstrap.
    user: '0'
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_PORT: 8080
      # The three settings Zitadel checks every request's Host against (docs/README.md §4.3): the public origin is
      # https://auth.localtest.me:8443, terminated at Traefik, so Zitadel itself speaks plain h2c behind it.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE}
      ZITADEL_TLS_ENABLED: false
      ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN}

      # First instance: the human admin, the Login V2 client, and the bootstrap machine user (IAM_OWNER), whose
      # personal access tokens are written to the zitadel-bootstrap volume at first start.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login V2 client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${PAT_EXPIRATION}
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${PAT_EXPIRATION}

      # Login V2 is the only login UI in v4 (docs/README.md §4.2).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}/ui/v2/login/logout?post_logout_redirect=

      # Short-lived tokens so the BFF's refresh path is exercised (docs/README.md §4.4).
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_ACCESSTOKENLIFETIME: 10m
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_IDTOKENLIFETIME: 10m
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_REFRESHTOKENIDLEEXPIRATION: 8h
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_REFRESHTOKENEXPIRATION: 8h

      # Login policy: the login form does not reveal whether a username exists (docs/README.md §9); self
      # registration is on for the sign-up story (§6.4).
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_IGNOREUNKNOWNUSERNAMES: true
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: true

      # Zitadel's outbound HTTP client (back-channel logout, actions) refuses private and loopback addresses by
      # default, which is every service in this stack and the host under Tilt. Only the link-local range stays
      # denied here (cloud metadata endpoints); a real deployment keeps the default list.
      ZITADEL_HTTPCLIENT_DENYLIST: 169.254.0.0/16

      # Outbound mail goes to Mailpit.
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: false
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${MAIL_FROM_ADDRESS}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ${MAIL_FROM_NAME}
      ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN: false
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    # Zitadel reaches the apps the way the apps reach Zitadel: by their public hostname through the host's
    # published port (back-channel logout, docs/README.md §4.4). One entry per app hostname.
    extra_hosts:
      - dashboard.localtest.me:host-gateway
      - tenancy.localtest.me:host-gateway
    volumes:
      - zitadel-bootstrap:/bootstrap:rw
    networks:
      - auth-stack
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=auth-stack
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      # /api/... is an alias that is stripped before reaching the API.
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false
      - traefik.http.routers.zitadel-api-alias.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api-alias.entrypoints=websecure
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      # Everything else that is not the login UI goes to the API (gRPC, Connect, REST, OIDC, the console).
      - traefik.http.routers.zitadel-canonical.rule=Host(`${ZITADEL_DOMAIN}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-canonical.entrypoints=websecure
      - traefik.http.routers.zitadel-canonical.service=zitadel-api
      - traefik.http.routers.zitadel-canonical.priority=100

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION}
    restart: unless-stopped
    user: '0'
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET}
      # The login container calls the API by service name but must present the public Host and scheme.
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https
    healthcheck:
      test:
        [
          'CMD',
          '/bin/sh',
          '-c',
          'node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy',
        ]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
    networks:
      - auth-stack
    depends_on:
      zitadel-api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=auth-stack
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      # The bare root of the hostname lands on the login UI.
      - traefik.http.middlewares.zitadel-root-rewrite.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`${ZITADEL_DOMAIN}`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=websecure
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-rewrite
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      - traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=websecure
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250

  # One-shot (ticket 17b): the development CA and Zitadel's certificate in ./.local/tls, created when absent, plus
  # the dynamic configuration Traefik reads them from (docker/tls/generate.sh). Idempotent; exits 0 at once when
  # the files exist. `proxy` depends on it, which is what lets `up --wait` accept its exit (docker/README.md).
  tls:
    image: ${OPENSSL_IMAGE}
    entrypoint: ['/bin/sh', '/generate.sh']
    environment:
      TLS_HOSTNAME: ${ZITADEL_DOMAIN}
    volumes:
      - ./docker/tls/generate.sh:/generate.sh:ro
      - ./.local/tls:/tls
    networks:
      - auth-stack

  proxy:
    image: ${TRAEFIK_IMAGE}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=auth-stack
      # The certificate, from the directory the tls one-shot writes; watched, so a Traefik that started before the
      # files existed (Tilt starts services as soon as their container runs) loads them when they appear.
      - --providers.file.directory=/tls
      - --providers.file.watch=true
      # TLS on the one public entrypoint; every router of the Zitadel services is on it. No plain entrypoint is
      # published, so there is one origin and one issuer: https://auth.localtest.me:8443.
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Health check only, not published: the healthcheck subcommand speaks plain HTTP.
      - --entrypoints.ping.address=:8082
      - --api.dashboard=false
      - --ping=true
      - --ping.entrypoint=ping
      - --log.level=INFO
    ports:
      # The one public port of Zitadel: https://auth.localtest.me:8443
      - '${ZITADEL_EXTERNALPORT}:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.local/tls:/tls:ro
    healthcheck:
      # The healthcheck subcommand is a separate process and does not see the flags above, so it gets its own.
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --ping.entrypoint=ping
        - --entrypoints.ping.address=:8082
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack
    depends_on:
      tls:
        condition: service_completed_successfully
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  spicedb-migrate:
    image: ${SPICEDB_IMAGE}
    # One-shot: brings the spicedb database schema to the current revision, then exits 0. Compose starts it only
    # once Postgres is healthy; Tilt starts it as soon as the Postgres container runs, so it retries until Postgres
    # accepts connections.
    command: migrate head --datastore-engine postgres --datastore-conn-uri "${SPICEDB_DATASTORE_CONN_URI}"
    restart: on-failure
    networks:
      - auth-stack
    depends_on:
      postgres:
        condition: service_healthy

  spicedb:
    image: ${SPICEDB_IMAGE}
    restart: unless-stopped
    command: >-
      serve
      --grpc-preshared-key "${SPICEDB_PRESHARED_KEY}"
      --datastore-engine postgres
      --datastore-conn-uri "${SPICEDB_DATASTORE_CONN_URI}"
      --telemetry-endpoint ""
    ports:
      # gRPC, published for processes run on the host by Tilt (ticket 5).
      - '50051:50051'
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=localhost:50051']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    # Append-only persistence so application sessions survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Published for processes run on the host by Tilt (ticket 5).
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack

  mailpit:
    image: ${MAILPIT_IMAGE}
    restart: unless-stopped
    ports:
      # Web UI: http://localhost:8025. SMTP (1025) is reached by service name only.
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack

  # One-shot (ticket 4): configures Zitadel through its API with the bootstrap machine user's PAT, seeds the users,
  # and writes the apps' configuration to ./.local/config. Idempotent, so every run creates nothing it finds; exits
  # non-zero on failure, which holds back the apps that depend on it. In the apps profile, so the reviewer path's
  # `up` runs it before the apps; outside that profile (Tilt, CI) it is an explicit step,
  # `docker compose run --rm --build bootstrap`, which blocks until it finishes and returns its exit code. It
  # cannot be in the default set: `up --wait` treats an exited one-shot as a failure unless a started service
  # depends on it with service_completed_successfully, and its only dependents are the apps.
  bootstrap:
    profiles:
      - apps
      - bootstrap
    build:
      context: .
      dockerfile: apps/bootstrap/Dockerfile
    image: auth-stack/bootstrap:dev
    # Root so it can write the bind-mounted ./.local/config on a Linux host, where Docker creates the directory
    # as root on a clean checkout (the PAT it reads is world-readable).
    user: '0'
    environment:
      # Same Zitadel URL as the browser (docs/README.md §4.3, option (a)), so the issuer it writes is the public one.
      ZITADEL_URL: https://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}
      # Node trusts the development CA that signed Zitadel's certificate (ticket 17b).
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      ZITADEL_PAT_FILE: /bootstrap/bootstrap.pat
      CONFIG_DIR: /config
      DASHBOARD_WEB_URL: ${DASHBOARD_WEB_URL}
      TENANCY_WEB_URL: ${TENANCY_WEB_URL}
      DASHBOARD_API_URL: ${DASHBOARD_API_URL}
      TENANCY_API_URL: ${TENANCY_API_URL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      # SpiceDB, for the schema write (ticket 6) and the seeded relationships (ticket 12).
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY}
      SPICEDB_INSECURE: ${SPICEDB_INSECURE}
      # The service databases, for the migrations (ticket 7) and the seeds (ticket 12).
      TENANCY_DATABASE_URL: ${TENANCY_DATABASE_URL}
      DOCUMENTS_DATABASE_URL: ${DOCUMENTS_DATABASE_URL}
    extra_hosts:
      - auth.localtest.me:host-gateway
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
      - ./.local/config:/config
      - ./.local/tls:/tls:ro
    networks:
      - auth-stack
    depends_on:
      proxy:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Apps profile: the containerized apps, for the reviewer path where everything runs in compose.
  # `docker compose --profile apps up -d --wait --build`.
  dashboard-web:
    profiles:
      - apps
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
    image: auth-stack/dashboard-web:dev
    restart: unless-stopped
    ports:
      # http://dashboard.localtest.me:3000 (one hostname per app; see docker/README.md)
      - '3000:3000'
    environment:
      # The BFF session (packages/auth, ticket 9): the key of the login stash cookie and the session store. The
      # OIDC application, APP_URL, DASHBOARD_API_URL, and TENANCY_API_URL come from the handoff file the
      # entrypoint sources. No database and no SpiceDB (ticket 19): every documents operation is a call to
      # dashboard-api with the user's token, and Redis is the one connection of its own.
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: ${REDIS_URL}
      # Node trusts the development CA that signed Zitadel's certificate (ticket 17b).
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    # Same Zitadel URL as the browser (docs/README.md §4.3, option (a)): the hostname maps to the host, where
    # Traefik publishes port 8443.
    extra_hosts:
      - auth.localtest.me:host-gateway
    volumes:
      # Generated configuration (OIDC client ID and issuer), written by the bootstrap container.
      - ./.local/config:/config:ro
      # The development CA (ca.crt is the one file read; the keys are root-only).
      - ./.local/tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3000/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack
    depends_on:
      # Implies a healthy Zitadel; the app must not start before its env file exists.
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      dashboard-api:
        condition: service_healthy
      tenancy-api:
        condition: service_healthy

  # The second client (ticket 17): organizations, members, and policy over tenancy-api, with its own OIDC
  # application and session cookie; what proves single sign-on and sign-out between two BFFs (ticket 20). No
  # database and no SpiceDB: tenancy-api holds both, and the one documents call of its login (the personal
  # workspace, ticket 19) goes to dashboard-api.
  tenancy-web:
    profiles:
      - apps
    build:
      context: .
      dockerfile: apps/tenancy-web/Dockerfile
    image: auth-stack/tenancy-web:dev
    restart: unless-stopped
    ports:
      # http://tenancy.localtest.me:3001 (one hostname per app; see docker/README.md)
      - '3001:3001'
    environment:
      # The BFF session (packages/auth): the key of the login stash cookie and the session store, shared with
      # dashboard-web under a prefix of its own. The OIDC application, APP_URL, DASHBOARD_API_URL, and
      # TENANCY_API_URL come from the handoff file the entrypoint sources.
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: ${REDIS_URL}
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    # Same Zitadel URL as the browser (docs/README.md §4.3, option (a)).
    extra_hosts:
      - auth.localtest.me:host-gateway
    volumes:
      # Generated configuration (OIDC client ID and issuer), written by the bootstrap container.
      - ./.local/config:/config:ro
      - ./.local/tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3001/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      dashboard-api:
        condition: service_healthy
      tenancy-api:
        condition: service_healthy

  # The tenancy service (ticket 16): bearer tokens of the project, scopes from SpiceDB, its own database. Reached
  # by service name only (docker/README.md); under Tilt it runs on the host on the same port.
  tenancy-api:
    profiles:
      - apps
    build:
      context: .
      dockerfile: apps/tenancy-api/Dockerfile
    image: auth-stack/tenancy-api:dev
    restart: unless-stopped
    environment:
      PORT: 4001
      TENANCY_DATABASE_URL: ${TENANCY_DATABASE_URL}
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY}
      SPICEDB_INSECURE: ${SPICEDB_INSECURE}
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    # The JWKS and userinfo URLs are the public issuer's (docs/README.md §4.3, option (a)).
    extra_hosts:
      - auth.localtest.me:host-gateway
    volumes:
      # Generated configuration (issuer, project ID, JWKS and userinfo URLs), written by the bootstrap container.
      - ./.local/config:/config:ro
      - ./.local/tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:4001/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy

  # The documents service (ticket 19a): the documents domain behind bearer tokens, on its own database and
  # SpiceDB, with tenancy over HTTP for organization names. Reached by service name only: the BFFs call it with
  # the user's token (ticket 19), and it is the one place that checks SpiceDB for documents.
  dashboard-api:
    profiles:
      - apps
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    image: auth-stack/dashboard-api:dev
    restart: unless-stopped
    environment:
      PORT: 4002
      DOCUMENTS_DATABASE_URL: ${DOCUMENTS_DATABASE_URL}
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY}
      SPICEDB_INSECURE: ${SPICEDB_INSECURE}
      TENANCY_API_URL: ${TENANCY_API_URL}
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    # The JWKS URL is the public issuer's (docs/README.md §4.3, option (a)).
    extra_hosts:
      - auth.localtest.me:host-gateway
    volumes:
      # Generated configuration (issuer, project ID, JWKS URL), written by the bootstrap container.
      - ./.local/config:/config:ro
      - ./.local/tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:4002/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - auth-stack
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      tenancy-api:
        condition: service_healthy

  # Tools profile: not started by `up`. `pnpm authz:zed <args>` runs SpiceDB's CLI against the stack.
  zed:
    image: ${ZED_IMAGE}
    profiles:
      - tools
    environment:
      ZED_ENDPOINT: spicedb:50051
      ZED_TOKEN: ${SPICEDB_PRESHARED_KEY}
      ZED_INSECURE: 'true'
    volumes:
      # The schema file, for `zed validate` without a server: `pnpm authz:validate` (run with --no-deps).
      - ./packages/authz:/authz:ro
    networks:
      - auth-stack
    depends_on:
      spicedb:
        condition: service_healthy

networks:
  auth-stack:
    name: auth-stack

volumes:
  postgres-data:
  redis-data:
  # Holds the two personal access tokens Zitadel writes at first start. Mounted read-write in zitadel-api,
  # read-only in zitadel-login and bootstrap, never in an app.
  zitadel-bootstrap:
